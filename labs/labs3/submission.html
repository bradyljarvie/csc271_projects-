<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Submission</title>
</head>
<body>
    <form action="index.html">
        <p>
            Recipe Name: 
            <input type="text" name="Recipe Name" size="15"
            maxlength="30" />
        </p>
    </form>

    <form action="index.html">
        <p>
            Ingredients + Instructions:
            <textarea name="Ingredients" cols="20" rows="4"> List ingredients:
            </textarea>
        </p>
    </form>
    <form action="index.html">
        <p> Check Difficulty Level:
            <br />
            <input type="radio" name="Difficulty" value="easy" checked="checked" /> Easy
            <input type="radio" name="Difficulty" value="medium" checked="checked" /> Medium
            <input type="radio" name="Difficulty" value="hard" checked="checked" /> Hard
        </p>
    </form>

    <form action="index.html">
        <p>
            <br />
            <input type="checkbox" name="dietarypreference"
        </p>
    </form>
</body>
</html>
